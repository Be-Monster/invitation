<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Invitation</title>
  
  <!-- St.PageFlip Library -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      /* Warm luxury dark background that highlights the invitation */
      background: radial-gradient(circle, #252427 0%, #121214 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0 16px 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      touch-action: none;
    }

    /* Zoom & Pan Viewport */
    .viewport {
      width: 100%;
      height: 78vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      cursor: grab;
    }

    .viewport:active {
      cursor: grabbing;
    }

    .pan-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      transition: transform 0.1s ease-out;
      will-change: transform;
    }

    /* Flipbook styling without harsh lines */
    #book {
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      background: #ffffff;
      border: none !important;
      outline: none !important;
    }

    .stf__wrapper {
      box-shadow: none !important;
    }

    /* Bottom Control Bar */
    .controls-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 50;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.1);
      padding: 6px 14px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .btn {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      border: none;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.9);
      background: rgba(255, 255, 255, 0.4);
    }

    .page-indicator {
      color: #f0f0f0;
      font-size: 13px;
      font-weight: 600;
      min-width: 45px;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .hint {
      color: rgba(255, 255, 255, 0.5);
      font-size: 11px;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>

  <!-- Touch & Pan Viewport -->
  <div class="viewport" id="viewport">
    <div class="pan-container" id="panContainer">
      <div id="book"></div>
    </div>
  </div>

  <!-- Bottom Navigation & Zoom Controls -->
  <div class="controls-wrapper">
    <div class="controls">
      <button class="btn" id="prevBtn" title="Previous Page">❮</button>
      <span class="page-indicator" id="pageNumber">1 / 5</span>
      <button class="btn" id="nextBtn" title="Next Page">❯</button>
      <button class="btn" id="zoomInBtn" title="Zoom In">➕</button>
      <button class="btn" id="zoomOutBtn" title="Zoom Out">➖</button>
      <button class="btn" id="resetZoomBtn" title="Reset View">🔄</button>
    </div>
    <p class="hint" id="statusHint">Swipe pages • Use ➕ to zoom & drag to pan</p>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const bookEl = document.getElementById('book');
      const panContainer = document.getElementById('panContainer');
      const viewport = document.getElementById('viewport');
      const pageNumberEl = document.getElementById('pageNumber');
      const statusHint = document.getElementById('statusHint');

      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const zoomInBtn = document.getElementById('zoomInBtn');
      const zoomOutBtn = document.getElementById('zoomOutBtn');
      const resetZoomBtn = document.getElementById('resetZoomBtn');

      /* ========================================================
         1. BUILT-IN REALISTIC PAGE TURN SOUND (WEB AUDIO API)
         ======================================================== */
      let audioCtx = null;
      function playPaperSound() {
        try {
          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (audioCtx.state === 'suspended') {
            audioCtx.resume();
          }

          // Generate short, soft paper-swipe noise
          const duration = 0.16;
          const bufferSize = audioCtx.sampleRate * duration;
          const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
          const data = buffer.getChannelData(0);

          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.pow(1 - (i / bufferSize), 2.2);
          }

          const noise = audioCtx.createBufferSource();
          noise.buffer = buffer;

          const filter = audioCtx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(1100, audioCtx.currentTime);
          filter.frequency.exponentialRampToValueAtTime(320, audioCtx.currentTime + duration);
          filter.Q.value = 1.1;

          const gain = audioCtx.createGain();
          gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + duration);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(audioCtx.destination);

          noise.start();
        } catch (e) {
          console.log("Audio not supported yet:", e);
        }
      }

      // Unlock AudioContext on first touch
      window.addEventListener('touchstart', function unlockAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        window.removeEventListener('touchstart', unlockAudio);
      }, { once: true });

      /* ========================================================
         2. INITIALIZE FLIPBOOK
         ======================================================== */
      const pageFlip = new St.PageFlip(bookEl, {
        width: 400,
        height: 600,
        size: 'stretch',
        minWidth: 260,
        maxWidth: 600,
        minHeight: 390,
        maxHeight: 900,
        maxShadowOpacity: 0.12, /* Soft, realistic lighting */
        showCover: true,
        usePortrait: true,
        mobileScrollSupport: false
      });

      pageFlip.loadFromImages([
        '1.jpg',
        '2.jpg',
        '3.jpg',
        '4.jpg',
        '5.jpg'
      ]);

      pageFlip.on('flip', (e) => {
        pageNumberEl.textContent = `${e.data + 1} / 5`;
        playPaperSound();
        resetZoom(); // Reset pan when turning page
      });

      prevBtn.addEventListener('click', () => {
        pageFlip.flipPrev();
        playPaperSound();
      });

      nextBtn.addEventListener('click', () => {
        pageFlip.flipNext();
        playPaperSound();
      });

      /* ========================================================
         3. ZOOM & DRAG/PAN SYSTEM (UP, DOWN, LEFT, RIGHT)
         ======================================================== */
      let scale = 1;
      let posX = 0;
      let posY = 0;
      let isDragging = false;
      let startTouchX = 0;
      let startTouchY = 0;

      function updateTransform() {
        panContainer.style.transform = `translate3d(${posX}px, ${posY}px, 0) scale(${scale})`;
      }

      function zoomIn() {
        if (scale < 2.5) {
          scale += 0.4;
          statusHint.textContent = "Drag anywhere to move around";
          updateTransform();
        }
      }

      function zoomOut() {
        if (scale > 1) {
          scale -= 0.4;
          if (scale <= 1) resetZoom();
          else updateTransform();
        }
      }

      function resetZoom() {
        scale = 1;
        posX = 0;
        posY = 0;
        statusHint.textContent = "Swipe pages • Use ➕ to zoom & drag to pan";
        updateTransform();
      }

      zoomInBtn.addEventListener('click', zoomIn);
      zoomOutBtn.addEventListener('click', zoomOut);
      resetZoomBtn.addEventListener('click', resetZoom);

      // Touch Pan events (Mobile)
      viewport.addEventListener('touchstart', (e) => {
        if (scale > 1 && e.touches.length === 1) {
          isDragging = true;
          startTouchX = e.touches[0].clientX - posX;
          startTouchY = e.touches[0].clientY - posY;
        }
      }, { passive: true });

      viewport.addEventListener('touchmove', (e) => {
        if (!isDragging || scale <= 1) return;
        
        posX = e.touches[0].clientX - startTouchX;
        posY = e.touches[0].clientY - startTouchY;

        // Keep within reasonable screen bounds
        const maxPanX = (scale - 1) * 200;
        const maxPanY = (scale - 1) * 350;
        posX = Math.max(-maxPanX, Math.min(maxPanX, posX));
        posY = Math.max(-maxPanY, Math.min(maxPanY, posY));

        updateTransform();
      }, { passive: true });

      viewport.addEventListener('touchend', () => {
        isDragging = false;
      });
    });
  </script>
</body>
</html>
